version: '3.8'

services:

  # ═══════════════════════════════════════
  # DATABASES
  # ═══════════════════════════════════════

  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user_service_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_user_data:/var/lib/mysql
      - ./init-db/user_service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-net

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: order_service_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_order_data:/var/lib/mysql
      - ./init-db/order_service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-net

  mysql-catalog:
    image: mysql:8.0
    container_name: mysql-catalog
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: catalog_service_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_catalog_data:/var/lib/mysql
      - ./init-db/catalog_service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-net

  mysql-trip:
    image: mysql:8.0
    container_name: mysql-trip
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: trip_service_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_trip_data:/var/lib/mysql
      - ./init-db/trip_service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-net

  # ═══════════════════════════════════════
  # CATALOG SERVICE
  # ═══════════════════════════════════════

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: mysql-catalog
      DB_PORT: 3306
      DB_NAME: catalog_service_db
      DB_USER: root
      DB_PASS: rootpassword
      ALLOWED_ORIGIN: http://api-gateway:3000
    ports:
      - "3002:3002"
    depends_on:
      mysql-catalog:
        condition: service_healthy
    networks:
      - microservice-net

  # ═══════════════════════════════════════
  # TRIP SERVICE
  # ═══════════════════════════════════════

  trip-service:
    build: ./trip-service
    container_name: trip-service
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: mysql-trip
      DB_PORT: 3306
      DB_NAME: trip_service_db
      DB_USER: root
      DB_PASS: rootpassword
      ALLOWED_ORIGIN: http://api-gateway:3000
    ports:
      - "3003:3003"
    depends_on:
      mysql-trip:
        condition: service_healthy
    networks:
      - microservice-net

  # ═══════════════════════════════════════
  # USER SERVICE
  # ═══════════════════════════════════════

  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql-user
      DB_PORT: 3306
      DB_NAME: user_service_db
      DB_USER: root
      DB_PASS: rootpassword
      ACCESS_TOKEN_SECRET: my_super_secret_jwt_key_2024
      ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      mysql-user:
        condition: service_healthy
    networks:
      - microservice-net

  # ═══════════════════════════════════════
  # NOTIFICATION SERVICE
  # ═══════════════════════════════════════

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: 3005
      # --- Điền vào đây để gửi email thật ---
      MAIL_USER: $MAIL_USER   # your_gmail@gmail.com
      MAIL_PASS: $MAIL_PASS   # App Password từ Google
    ports:
      - "3005:3005"
    networks:
      - microservice-net

  # ═══════════════════════════════════════
  # ORDER SERVICE
  # ═══════════════════════════════════════

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: mysql-order
      DB_PORT: 3306
      DB_NAME: order_service_db
      DB_USER: root
      DB_PASS: rootpassword
      TRIP_SERVICE_URL: http://trip-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      ALLOWED_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      # --- VNPAY Sandbox (đăng ký tại sandbox.vnpayment.vn) ---
      VNPAY_TMN_CODE: $VNPAY_TMN_CODE
      VNPAY_HASH_SECRET: $VNPAY_HASH_SECRET
      VNPAY_RETURN_URL: $VNPAY_RETURN_URL
    ports:
      - "3004:3004"
    depends_on:
      mysql-order:
        condition: service_healthy
      trip-service:
        condition: service_started
      catalog-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - microservice-net

  # ═══════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      ACCESS_TOKEN_SECRET: my_super_secret_jwt_key_2024
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3004
      CATALOG_SERVICE_URL: http://catalog-service:3002
      TRIP_SERVICE_URL: http://trip-service:3003
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - order-service
      - catalog-service
      - trip-service
    networks:
      - microservice-net

volumes:
  mysql_user_data:
  mysql_order_data:
  mysql_catalog_data:
  mysql_trip_data:

networks:
  microservice-net:
    driver: bridge
